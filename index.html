<!DOCTYPE html>
<html>
    <head>
        <title>Learn Python</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Welcome to the Python Learning Site</h1>

        <section class="lesson">
            <h2 id="lesson-title"></h2>
            <p id="lesson-text"></p>
            <p><strong>Your turn:</strong> <span id="lesson-task"></span></p>
        </section>

        <div class="nav">
            <button id="reset-button" class="secondary">Reset progress</button>
            <button id="prev-button">Previous</button>
            <span id="lesson-counter">Lesson 1 of 3</span>
            <button id="next-button">Next</button>
        </div>

        <div class="progress">
            <div id="progress-bar"></div>
        </div>
        <p id="progress-text">Progress: 0%</p>

        <section class="editor">

         <label for="code-input">Write your Python code here</label>
         <textarea id="code-input" rows="6">print("Hello, World!")</textarea>
         <button id="run-button">Run</button>
        </section>

        <section class="output">
            <h3>Output:</h3>
            <pre id="output-box">Your result will appear here</pre>
            <p id="feedback"></p>
        </section>
        
        <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
        <script src="script.js"></script>
    </body>
</html>
